<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Studio Pro</title>
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.all.bundle.min.mjs",
    "@imgly/background-removal": "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/dist/index.mjs"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">Image Studio Pro</span>
    </div>
    <div class="topbar-center">
      <button class="tb-btn" id="btnOpen" title="Open Image (Ctrl+O)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>Open</span>
      </button>
      <button class="tb-btn" id="btnUndo" title="Undo (Ctrl+Z)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span>Undo</span>
      </button>
      <button class="tb-btn" id="btnRedo" title="Redo (Ctrl+Shift+Z)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>Redo</span>
      </button>
      <button class="tb-btn" id="btnSave" title="Save Image (Ctrl+S)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>Save</span>
      </button>
      <div class="tb-divider"></div>
      <button class="tb-btn" id="btnFit" title="Fit to Screen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
      <button class="tb-btn" id="btnActual" title="Actual Size">
        <span>1:1</span>
      </button>
    </div>
    <div class="topbar-right">
      <span class="image-info" id="imageInfo">No image</span>
    </div>
  </header>

  <div class="workspace">
    <!-- LEFT SIDEBAR -->
    <nav class="sidebar">
      <button class="side-btn active" data-tool="crop" title="Crop">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
        <span>Crop</span>
      </button>
      <button class="side-btn" data-tool="resize" title="Resize">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        <span>Resize</span>
      </button>
      <button class="side-btn" data-tool="filter" title="Filters">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span>Filters</span>
      </button>
      <button class="side-btn" data-tool="grid" title="Grid Split">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        <span>Grid Split</span>
      </button>
      <button class="side-btn" data-tool="bgremove" title="Background Removal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        <span>BG Remove</span>
      </button>
      <button class="side-btn" data-tool="rotate" title="Rotate & Flip">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>Rotate</span>
      </button>
    </nav>

    <!-- CANVAS AREA -->
    <main class="canvas-area" id="canvasArea">
      <div class="dropzone" id="dropzone">
        <div class="dropzone-content">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <h2>Drop an image here</h2>
          <p>or click to browse — PNG, JPG, WEBP, GIF, SVG</p>
        </div>
      </div>
      <div class="canvas-wrap" id="canvasWrap" style="display:none">
        <canvas id="mainCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
      </div>
      <div class="zoom-indicator" id="zoomIndicator">100%</div>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="panel" id="panel">
      <div class="panel-empty">
        <p>Load an image to start editing</p>
      </div>
    </aside>
  </div>

  <!-- STATUS BAR -->
  <footer class="statusbar">
    <span id="statusDim">—</span>
    <span class="status-sep">|</span>
    <span id="statusTool">Ready</span>
    <span class="status-sep">|</span>
    <span id="statusZoom">Fit</span>
  </footer>
</div>

<!-- SAVE DIALOG -->
<div class="modal-overlay" id="saveModal" style="display:none">
  <div class="modal">
    <h3>Save Image</h3>
    <div class="col"><label>Filename</label>
      <input type="text" id="saveFilename" class="modal-input">
    </div>
    <div class="col"><label>Format</label>
      <select id="saveFormat">
        <option value="png">PNG — lossless, supports transparency</option>
        <option value="jpeg">JPEG — smaller file, no transparency</option>
        <option value="webp">WebP — modern, small & transparent</option>
      </select>
    </div>
    <div class="col" id="qualityRow"><label>Quality: <span class="val" id="qualVal">92%</span></label>
      <input type="range" id="saveQuality" min="10" max="100" value="92">
    </div>
    <div class="modal-actions">
      <button class="btn" id="saveCancel">Cancel</button>
      <button class="btn primary" id="saveConfirm">Save</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script src="js/app.js"></script>
</body>
</html>
